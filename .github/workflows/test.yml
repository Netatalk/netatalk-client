name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types:
      - opened
      - synchronize
      - reopened

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    container:
      image: alpine:3.24.1
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base \
            ca-certificates \
            cmake \
            curl \
            git \
            muon \
            nodejs \
            npm \
            perl-tidy \
            shfmt \
            yamlfmt
          curl --proto '=https' --location --fail -o /tmp/markdownlint-cli2.tgz \
            https://registry.npmjs.org/markdownlint-cli2/-/markdownlint-cli2-0.22.0.tgz
          echo '98e0bd058fd71ad757dccf67dc080445defd174f92ef0d7cc81053348438e77b08f3b7ad65fa75cf879a8ea48c57bd026236f129ee64b4abd3d870a9bdc5b1f7  /tmp/markdownlint-cli2.tgz' \
            | sha512sum -c -
          npm install --global --ignore-scripts /tmp/markdownlint-cli2.tgz
      - name: Build astyle from source
        run: |
          curl --proto '=https' --location --fail -o /tmp/astyle.tar.gz \
            https://gitlab.com/saalen/astyle/-/archive/3.6.19/astyle-3.6.19.tar.gz
          echo '7bb1fa11ce24fb94db139bb49e73fd05604b28cd7fb75c0dcbf6661e52d3e43e  /tmp/astyle.tar.gz' \
            | sha256sum -c -
          mkdir -p /tmp/astyle
          tar -xzf /tmp/astyle.tar.gz -C /tmp/astyle --strip-components=1
          cmake -S /tmp/astyle -B /tmp/astyle/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/astyle/build -j"$(nproc)"
          cmake --install /tmp/astyle/build
          astyle --version
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check formatting
        run: ./contrib/scripts/codefmt.sh -v

  markdown-linting:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

  build-container-tests:
    name: Build integration test container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create image name
        run: |
          echo "IMAGE_NAME=${REPO,,}-tests" >> "${GITHUB_ENV}"
      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: test/integration/Dockerfile
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

  run-container-tests:
    name: Run integration tests
    needs: build-container-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Create image name
        run: |
          echo "IMAGE_NAME=${REPO,,}-tests" >> "${GITHUB_ENV}"
      - name: Prepare FUSE device
        run: |
          sudo modprobe fuse
          test -c /dev/fuse
      - name: Run integration tests including FUSE
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/integration-logs"
          # Docker's default AppArmor profile on Ubuntu denies mounts.
          docker run --rm \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            --volume "$RUNNER_TEMP/integration-logs:/test-logs" \
            -e AFP_TEST_LOG_DIR=/test-logs \
            -e AFP_TEST_FUSE=1 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            2>&1 | tee "$RUNNER_TEMP/integration-logs/integration-tests.log"
      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-logs
          path: ${{ runner.temp }}/integration-logs
          if-no-files-found: ignore

  distribution-tests:
    name: Distribution Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            gcc \
            libgcrypt-dev \
            libfuse-dev \
            libreadline-dev \
            meson \
            ninja-build \
            perl
      - name: Configure
        run: |
          meson setup build -Dbuildtype=release
      - name: Run distribution tests
        run: meson dist -C build
